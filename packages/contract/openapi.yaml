openapi: 3.1.0
info:
  title: Travertine Engine API
  version: 1.0.0
  summary: Crop-rotation decision support scored with Earth observation data.
  description: |
    Contract between `apps/web` and `services/engine`. Single source of truth for every field, type and unit.
    Every response that carries data includes a `provenance` array describing the datasets behind it.
    Units: millimetres (mm) for water depths, degrees Celsius for temperature, unitless 0–1 for scores and indices.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: Local engine (default port)
tags:
  - name: crops
    description: Crop catalogue and coefficients.
  - name: field
    description: Field-level climate, soil and vegetation history.
  - name: rotations
    description: Rotation exploration and scoring.
  - name: validation
    description: Back-test of the model against observed vegetation.
  - name: system
    description: Service status.

paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service health and version
      responses:
        "200":
          description: Engine is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/crops:
    get:
      tags: [crops]
      operationId: listCrops
      summary: Crop catalogue with FAO-56 coefficients
      responses:
        "200":
          description: All crops the engine can schedule.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Crop" }
        default: { $ref: "#/components/responses/Error" }

  /v1/field/ndvi:
    get:
      tags: [field]
      operationId: getFieldNdvi
      summary: Field-scale (30 m) NDVI history from Harmonized Landsat Sentinel-2
      description: "Separate from /v1/field/analyze because a cold request reads hundreds of scenes (about 2 minutes); warm requests come from the engine's cache. Load it after the field summary with its own loading state."
      parameters:
        - { name: lat, in: query, required: true, schema: { $ref: "#/components/schemas/Latitude" } }
        - { name: lon, in: query, required: true, schema: { $ref: "#/components/schemas/Longitude" } }
      responses:
        "200":
          description: Clear-sky observations and growing-season summaries for the 30 m pixel at the field centre.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldNdvi" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/field/analyze:
    post:
      tags: [field]
      operationId: analyzeField
      summary: Climate, soil and vegetation history for a field
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldAnalyzeRequest" }
      responses:
        "200":
          description: Field analysis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldAnalysis" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/rotations/explore:
    post:
      tags: [rotations]
      operationId: exploreRotations
      summary: Ranked rotation strategies under the given priorities
      description: Provide either `field_id` (from /v1/field/analyze) or `lat` and `lon`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotationExploreRequest" }
      responses:
        "200":
          description: Rotations sorted by `scores.total`, highest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationExploreResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/validation:
    get:
      tags: [validation]
      operationId: getValidation
      summary: Back-test of modelled stress against observed NDVI anomalies
      parameters:
        - { name: lat, in: query, required: true, schema: { $ref: "#/components/schemas/Latitude" } }
        - { name: lon, in: query, required: true, schema: { $ref: "#/components/schemas/Longitude" } }
        - { name: language, in: query, required: false, schema: { $ref: "#/components/schemas/Language" }, description: "Language of caveats[]. Default en." }
      responses:
        "200":
          description: Year-by-year back-test.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validation" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Latitude: { type: number, minimum: -90, maximum: 90, description: WGS84 latitude in decimal degrees. }
    Longitude: { type: number, minimum: -180, maximum: 180, description: WGS84 longitude in decimal degrees. }
    Unit01: { type: number, minimum: 0, maximum: 1 }
    Language:
      type: string
      enum: [en, tr]
      default: en
      description: "Language of engine-written sentences (explanations, caveats). Numbers inside them follow that language's convention (tr: 0,55, %4, 1 234). Ids, units, method and provenance stay English. Other values return 422."

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [invalid_geometry, out_of_coverage, upstream_unavailable] }
        message: { type: string, description: "Human-readable, English." }
        details: { type: object, additionalProperties: true }

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string, description: Engine semantic version. }

    Provenance:
      type: object
      required: [dataset, provider, spatial_resolution, temporal_coverage, access_url, note]
      properties:
        dataset: { type: string, description: Dataset name and version. }
        provider: { type: string }
        spatial_resolution: { type: string, description: "Human-readable, e.g. 0.5° × 0.625°, 250 m." }
        temporal_coverage: { type: string, description: "Human-readable, e.g. 2001–2024, monthly." }
        access_url: { type: string, format: uri }
        note: { type: string, description: "How it was used, derivations, limitations. Empty string if none." }

    Crop:
      type: object
      required: [id, name, family, is_legume, season, growing_days, kc_ini, kc_mid, kc_end, root_depth_m, source]
      properties:
        id: { type: string, pattern: "^[a-z0-9_]+$" }
        name: { type: string, description: English display name. }
        family: { type: string, description: "Botanical family, e.g. Poaceae." }
        is_legume: { type: boolean }
        season: { type: string, enum: [winter, summer, perennial] }
        growing_days: { type: integer, minimum: 1, description: Total length of the growing period in days. }
        kc_ini: { type: number, minimum: 0 }
        kc_mid: { type: number, minimum: 0 }
        kc_end: { type: number, minimum: 0 }
        root_depth_m: { type: number, minimum: 0, description: Maximum effective rooting depth (m). }
        source: { type: string, description: Citation for the coefficients. }

    PolygonGeometry:
      type: object
      description: GeoJSON Polygon (RFC 7946), WGS84, counter-clockwise outer ring.
      required: [type, coordinates]
      properties:
        type: { type: string, const: Polygon }
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 3
              items: { type: number }

    FieldAnalyzeRequest:
      type: object
      required: [lat, lon, irrigated]
      properties:
        lat: { $ref: "#/components/schemas/Latitude" }
        lon: { $ref: "#/components/schemas/Longitude" }
        geometry: { $ref: "#/components/schemas/PolygonGeometry" }
        irrigated: { type: boolean }

    ClimateYear:
      type: object
      required: [year, precipitation_mm, et0_mm, mean_temp_c, root_zone_wetness]
      properties:
        year: { type: integer }
        precipitation_mm: { type: number, minimum: 0, description: Annual total precipitation (mm). }
        et0_mm: { type: number, minimum: 0, description: Annual reference evapotranspiration (mm). }
        mean_temp_c: { type: number, description: Annual mean 2 m air temperature (°C). }
        root_zone_wetness:
          allOf: [{ $ref: "#/components/schemas/Unit01" }]
          description: Annual mean root-zone soil wetness, 0 (dry) to 1 (saturated).

    Soil:
      type: object
      required: [texture, organic_carbon, ph, awc_mm]
      properties:
        texture: { type: string, description: "USDA texture class, e.g. clay loam." }
        organic_carbon: { type: number, minimum: 0, description: Soil organic carbon in the 0–30 cm layer (g/kg). }
        ph: { type: number, minimum: 0, maximum: 14, description: "pH in water, 0–30 cm." }
        awc_mm: { type: number, minimum: 0, description: Plant-available water capacity of the 0–100 cm profile (mm). }

    NdviYear:
      type: object
      required: [year, mean_ndvi]
      properties:
        year: { type: integer }
        mean_ndvi: { type: number, minimum: -1, maximum: 1, description: Growing-season (Apr–Sep) mean NDVI. }

    FieldAnalysis:
      type: object
      required: [field_id, climate, soil, provenance]
      properties:
        field_id: { type: string, description: Opaque id usable in /v1/rotations/explore. }
        climate:
          type: array
          description: One item per year, ascending.
          items: { $ref: "#/components/schemas/ClimateYear" }
        soil: { $ref: "#/components/schemas/Soil" }
        ndvi_history:
          type: array
          description: One item per year, ascending. Omitted when no vegetation record is available.
          items: { $ref: "#/components/schemas/NdviYear" }
        provenance:
          type: array
          items: { $ref: "#/components/schemas/Provenance" }

    Priorities:
      type: object
      required: [water, income, soil, risk]
      description: Relative importance of each objective, 0–1. They need not sum to 1.
      properties:
        water: { $ref: "#/components/schemas/Unit01" }
        income: { $ref: "#/components/schemas/Unit01" }
        soil: { $ref: "#/components/schemas/Unit01" }
        risk: { $ref: "#/components/schemas/Unit01" }

    RotationExploreRequest:
      type: object
      required: [horizon_years, priorities, irrigated]
      properties:
        field_id: { type: string }
        lat: { $ref: "#/components/schemas/Latitude" }
        lon: { $ref: "#/components/schemas/Longitude" }
        horizon_years: { type: integer, enum: [3, 4, 5] }
        priorities: { $ref: "#/components/schemas/Priorities" }
        irrigated: { type: boolean }
        crop_ids:
          type: array
          description: Restrict candidates to these crops. Omit for all crops.
          items: { type: string }
        language:
          $ref: "#/components/schemas/Language"
          description: "Language of rotations[].explanation[]. Default en."
        current_rotation:
          type: array
          description: "Optional. The rotation the field grows now, one crop_id per year. A sequence shorter than horizon_years is repeated in order to fill it; a longer one is rejected (422). Any crop from /v1/crops may appear, whatever crop_ids says. It is scored with the same model as the candidates, even when it breaks the rotation rules, and returned as `baseline`."
          minItems: 1
          maxItems: 5
          items: { type: string }
        farmer_inputs:
          $ref: "#/components/schemas/FarmerInputs"
          description: "Optional. The farmer's own soil test and crop values; each one replaces the dataset estimate it names in the response's inputs[]. The allowed crops are crop_ids and irrigation is irrigated."
      anyOf:
        - required: [field_id]
        - required: [lat, lon]

    FarmerInputs:
      type: object
      additionalProperties: false
      properties:
        soil: { $ref: "#/components/schemas/FarmerSoil" }
        crop_values:
          type: object
          description: "Value per crop id for the income score, in any one unit (e.g. revenue per hectare at full yield). Only ratios matter: each crop year is weighted by its value divided by the largest. Must name every candidate crop (crop_ids, or all crops) and no others; at least one value above 0. Other inputs return 422."
          additionalProperties: { type: number, minimum: 0 }

    FarmerSoil:
      type: object
      additionalProperties: false
      description: "Topsoil test. sand_pct and clay_pct come together (silt = 100 − sand − clay) and set the texture class. If texture or organic carbon is given without available_water_mm_per_m, available water is recomputed from them with Saxton & Rawls (2006) as if the tested soil filled the root zone."
      properties:
        sand_pct: { type: number, minimum: 0, maximum: 100, description: "Sand, % of fine earth." }
        clay_pct: { type: number, minimum: 0, maximum: 100, description: "Clay, % of fine earth. sand_pct + clay_pct ≤ 100." }
        organic_carbon_pct: { type: number, minimum: 0, maximum: 20, description: "Soil organic carbon, % by mass (not organic matter)." }
        available_water_mm_per_m: { type: number, minimum: 20, maximum: 400, description: "Measured plant-available water (field capacity − wilting point), mm per metre of soil." }

    InputSource:
      type: object
      required: [name, value, unit, source, replaces]
      properties:
        name:
          type: string
          description: "soil.sand_pct, soil.clay_pct, soil.organic_carbon_pct, soil.texture_class, soil.available_water_mm_per_m, allowed_crops, irrigated, crop_values (default) or crop_value.<crop_id> (farmer)."
        value: { type: [number, string], description: Value the engine used. }
        unit: { type: string, description: "%, mm/m, relative, or empty." }
        source:
          type: string
          enum: [farmer, dataset, default]
          description: "farmer = given in this request (or computed from the farmer's soil test); dataset = SoilGrids 2.0; default = engine default (no measurement)."
        replaces: { type: string, description: "When source is farmer, the estimate it replaced, e.g. \"SoilGrids 2.0, 0–100 cm: 139 mm/m\". Empty otherwise." }

    RotationScores:
      type: object
      required: [water, income, soil, risk, total]
      description: All scores 0–1, higher is better. `risk` is high when risk is LOW.
      properties:
        water: { $ref: "#/components/schemas/Unit01" }
        income: { $ref: "#/components/schemas/Unit01" }
        soil: { $ref: "#/components/schemas/Unit01" }
        risk: { $ref: "#/components/schemas/Unit01" }
        total: { $ref: "#/components/schemas/Unit01" }

    RotationYear:
      type: object
      required: [year_index, crop_id, water_demand_mm, water_deficit_mm, stress_index]
      properties:
        year_index: { type: integer, minimum: 1, description: 1-based year in the rotation. }
        crop_id: { type: string }
        water_demand_mm: { type: number, minimum: 0, description: Crop evapotranspiration ETc for the season (mm). }
        water_deficit_mm:
          type: number
          minimum: 0
          description: Demand not met by effective rainfall and stored soil water (mm); for irrigated fields, the irrigation requirement.
        stress_index: { $ref: "#/components/schemas/Unit01" }

    Rotation:
      type: object
      required: [sequence, scores, yearly, explanation]
      properties:
        sequence:
          type: array
          description: crop_id per year, length equals horizon_years.
          items: { type: string }
        scores: { $ref: "#/components/schemas/RotationScores" }
        yearly:
          type: array
          items: { $ref: "#/components/schemas/RotationYear" }
        explanation:
          type: array
          description: Plain-language English sentences explaining the score.
          items: { type: string }
        vs_baseline:
          $ref: "#/components/schemas/ScoreDifference"
          description: "Optional. Present on every alternative when the request carried current_rotation."

    ScoreDifference:
      type: object
      required: [water, income, soil, risk, total]
      description: "Score of an alternative minus the same score of the baseline (the current rotation), unitless, −1 to 1. Positive means the alternative scores higher. Differences between relative indices on past years, not predicted gains."
      properties:
        water: { type: number, minimum: -1, maximum: 1 }
        income: { type: number, minimum: -1, maximum: 1 }
        soil: { type: number, minimum: -1, maximum: 1 }
        risk: { type: number, minimum: -1, maximum: 1 }
        total: { type: number, minimum: -1, maximum: 1 }

    RuleViolation:
      type: object
      required: [rule, message]
      properties:
        rule:
          type: string
          enum: [same_family_in_consecutive_years, no_legume_in_cycle, perennial_single_year]
          description: "The rotation rule the current rotation breaks (docs/METHODOLOGY.md, section 7)."
        year_index:
          type: integer
          minimum: 1
          description: "1-based rotation year the violation falls in. Omitted for rules about the whole sequence (no_legume_in_cycle)."
        message: { type: string, description: "Which crops and why, in the request language. The UI renders it verbatim." }

    BaselineRotation:
      description: "The current rotation, expanded to horizon_years and scored like a candidate. It never carries vs_baseline."
      allOf:
        - $ref: "#/components/schemas/Rotation"
        - type: object
          required: [rule_violations]
          properties:
            rule_violations:
              type: array
              description: "Every rotation rule the sequence breaks, in year order. Empty when it breaks none."
              items: { $ref: "#/components/schemas/RuleViolation" }

    RotationExploreResponse:
      type: object
      required: [rotations, provenance]
      properties:
        rotations:
          type: array
          description: "Sorted by scores.total, highest first. When the request carried current_rotation, that sequence is left out of this list and returned as `baseline`."
          items: { $ref: "#/components/schemas/Rotation" }
        baseline:
          $ref: "#/components/schemas/BaselineRotation"
          description: "Optional. Present when the request carried current_rotation."
        inputs:
          type: array
          description: "Every input the scores rest on and where it came from: the farmer, a dataset, or an engine default."
          items: { $ref: "#/components/schemas/InputSource" }
        provenance:
          type: array
          items: { $ref: "#/components/schemas/Provenance" }

    ValidationYear:
      type: object
      required: [year, modelled_stress, observed_ndvi_anomaly]
      properties:
        year: { type: integer }
        modelled_stress: { $ref: "#/components/schemas/Unit01" }
        observed_ndvi_anomaly:
          type: number
          description: Standardised anomaly of growing-season mean NDVI (σ, z-score) relative to the record.
        baseline_index:
          type: number
          description: "Optional. Baseline dryness index for this year (1 − ΣP/ΣET0, April–September), unitless. Same value as in baseline.values."

    CorrelationInterval:
      type: array
      description: 95 % paired percentile bootstrap interval (lower, upper) of a Pearson correlation.
      minItems: 2
      maxItems: 2
      items: { type: number, minimum: -1, maximum: 1 }

    ValidationBaseline:
      type: object
      description: The same back-test for a climate-only dryness index, so the model can be judged against a simple baseline.
      required: [name, correlation, correlation_ci95, values]
      properties:
        name: { type: string, description: "Human-readable label, English." }
        correlation: { type: number, minimum: -1, maximum: 1, description: Pearson r between the baseline index and the NDVI anomaly. }
        correlation_ci95: { $ref: "#/components/schemas/CorrelationInterval" }
        values:
          type: array
          description: Baseline index per year, same years as Validation.years.
          items:
            type: object
            required: [year, value]
            properties:
              year: { type: integer }
              value: { type: number, description: "1 − ΣP/ΣET0 over April–September, unitless." }

    NdviObservation:
      type: object
      required: [date, ndvi, sensor]
      properties:
        date: { type: string, format: date }
        ndvi: { type: number, minimum: -1, maximum: 1, description: NDVI of one clear-sky observation (unitless). }
        sensor: { type: string, enum: [L30, S30], description: "L30 = Landsat 8/9, S30 = Sentinel-2 (HLS v2.0 products)." }

    NdviSeason:
      type: object
      required: [year, n_clear, n_scenes]
      properties:
        year: { type: integer }
        mean_ndvi:
          type: number
          minimum: -1
          maximum: 1
          description: "Mean of clear April–September observations (unitless). Omitted when n_clear < 5."
        n_clear: { type: integer, minimum: 0, description: Clear observations used. }
        n_scenes: { type: integer, minimum: 0, description: Scenes looked at that year. }

    FieldNdvi:
      type: object
      required: [observations, seasons, caveats, provenance]
      properties:
        observations:
          type: array
          description: Every clear-sky observation of the 30 m pixel at the field centre, ascending by date.
          items: { $ref: "#/components/schemas/NdviObservation" }
        seasons:
          type: array
          description: "Growing-season (April–September) summary per year, ascending by year."
          items: { $ref: "#/components/schemas/NdviSeason" }
        caveats:
          type: array
          description: Limitations. The UI renders these verbatim.
          items: { type: string }
        provenance:
          type: array
          items: { $ref: "#/components/schemas/Provenance" }

    Validation:
      type: object
      required: [years, correlation, n, method, caveats, provenance]
      properties:
        years:
          type: array
          items: { $ref: "#/components/schemas/ValidationYear" }
        correlation:
          type: number
          minimum: -1
          maximum: 1
          description: Correlation between modelled_stress and observed_ndvi_anomaly. Negative means more stress, less greenness.
        n: { type: integer, minimum: 0, description: Number of years used. }
        correlation_ci95:
          $ref: "#/components/schemas/CorrelationInterval"
          description: Optional. 95 % paired percentile bootstrap interval for correlation.
        baseline:
          $ref: "#/components/schemas/ValidationBaseline"
          description: Optional. The same statistic for a baseline dryness index.
        difference_ci95:
          type: array
          description: "Optional. 95 % interval of correlation − baseline.correlation (lower, upper)."
          minItems: 2
          maxItems: 2
          items: { type: number, minimum: -2, maximum: 2 }
        verdict:
          type: string
          enum: [model_better, baseline_better, no_detectable_difference]
          description: "Optional. Pre-registered rule (docs/VALIDATION.md): model_better only if difference_ci95 lies entirely below 0; baseline_better only if entirely above 0; otherwise no_detectable_difference."
        method: { type: string, description: "How the back-test was computed, including the correlation type." }
        caveats:
          type: array
          description: Limitations. The UI renders these verbatim.
          items: { type: string }
        provenance:
          type: array
          items: { $ref: "#/components/schemas/Provenance" }

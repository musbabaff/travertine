      kc: "FAO-56 Table 12, Barley (Kc ini 0.3 from the cereals group, Kc mid 1.15, Kc end 0.25)"
      root_depth: "FAO-56 Table 22, Barley (1.0–1.5 m)"
      p: "FAO-56 Table 22, Barley (0.55)"

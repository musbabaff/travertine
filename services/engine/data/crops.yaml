# Crop table for the Travertine engine.
#
# Every value is copied from a published table; `sources` names the document and table for each group of values.
# Abbreviations used in the sources:
#   FAO-56  Allen, R. G., Pereira, L. S., Raes, D., Smith, M. (1998). Crop evapotranspiration — Guidelines for
#           computing crop water requirements. FAO Irrigation and Drainage Paper 56. https://www.fao.org/4/x0490e/x0490e00.htm
#           Table 11 (stage lengths), Table 12 (Kc, crop height), Table 22 (rooting depth, p), Table 24 (Ky, reproduced
#           from FAO-33).
#   FAO-33  Doorenbos, J., Kassam, A. H. (1979). Yield response to water. FAO Irrigation and Drainage Paper 33.
#
# Conventions
#   * Where FAO-56 gives a range (e.g. rooting depth 1.0–1.7 m, Kc mid 1.15–1.20) the midpoint is used and the range
#     is kept in `*_range` so the uncertainty stays visible.
#   * Kc values are the Table 12 values for a sub-humid climate (RHmin ≈ 45 %, u2 ≈ 2 m/s). The engine adjusts Kc mid
#     and Kc end for local wind and humidity with FAO-56 eq. 62 at run time; the table values are not altered here.
#   * `stages` are one Table 11 row (initial / development / mid-season / late-season days). The row chosen is named
#     in `sources.stages`; Mediterranean or arid-region rows are preferred because the demo field is in inland Aegean
#     Turkey. Stage lengths are regional and should be replaced with local observations where they exist.
#   * `sowing_month` / `sowing_day` place the planting date from the month listed in that same Table 11 row: the 15th
#     of a single listed month, or the 1st of the second month when the row lists a two-month window (e.g. Oct/Nov →
#     1 November, April/May → 1 May, Mar–May → 15 April).
#   * `n_credit` (legumes only) is the nitrogen fertilizer replacement credit to the following non-legume crop, from
#     University of Wisconsin-Extension A3517 (Midwest US rotation studies). It is used only as a relative soil-health
#     indicator, not as a fertilizer recommendation for the field.
#   * `ky` is null where FAO-56 Table 24 (FAO-33) gives no value for the crop. The engine reports yield response only
#     for crops with a sourced Ky.
#
# Crops considered and left out (no published value for a required field):
#   * Chickpea — FAO-56 Table 12 and Table 22 list it, but Table 11 gives no stage lengths, so the season cannot be
#     placed without an unsourced assumption.

crops:
  - id: winter_wheat
    name: Winter wheat
    family: Poaceae
    is_legume: false
    season: winter
    sowing_month: 11
    sowing_day: 15
    stages: { ini: 30, dev: 140, mid: 40, late: 30 }
    kc: { ini: 0.70, mid: 1.15, end: 0.25 }
    kc_end_range: [0.25, 0.40]
    height_m: 1.0
    root_depth_m: 1.65
    root_depth_range_m: [1.5, 1.8]
    p: 0.55
    ky: 1.05
    sources:
      stages: "FAO-56 Table 11, Winter Wheat, November planting, Mediterranean (30/140/40/30 days)"
      kc: "FAO-56 Table 12, Winter Wheat with non-frozen soils (Kc ini 0.7, Kc mid 1.15, Kc end 0.25–0.4; lower bound used for a crop harvested dry)"
      root_depth: "FAO-56 Table 22, Winter Wheat (1.5–1.8 m)"
      p: "FAO-56 Table 22, Winter Wheat (0.55)"
      ky: "FAO-56 Table 24 (from FAO-33), Winter wheat (1.05)"


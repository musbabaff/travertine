name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data source
      description: Travertine shows nothing without a real data source. Which dataset or published source would back this?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

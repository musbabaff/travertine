name: Engine deploy

# Deploys the engine to Render only after CI passed on main and only when services/engine changed. (Requested in #19.)
# Requires: secret RENDER_DEPLOY_HOOK_URL, variable ENGINE_URL, and Auto-Deploy switched off in Render.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engine-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENGINE_URL: ${{ vars.ENGINE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Did the engine change?
        id: changed
        run: |
          if git diff --quiet HEAD^ HEAD -- services/engine; then echo "engine=false" >> "$GITHUB_OUTPUT"; else echo "engine=true" >> "$GITHUB_OUTPUT"; fi

      - name: Trigger Render deploy hook
        if: steps.changed.outputs.engine == 'true'
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1; fi
          case "$RENDER_DEPLOY_HOOK_URL" in
            https://api.render.com/deploy/*) ;;
            *) echo "::error::RENDER_DEPLOY_HOOK_URL must be the whole Render deploy hook URL, starting with https://api.render.com/deploy/ (no quotes or spaces). Re-set it with: gh secret set RENDER_DEPLOY_HOOK_URL"; exit 1 ;;
          esac
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null

      - name: Wait until the engine reports this commit
        if: steps.changed.outputs.engine == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The engine reports "<version>+<short sha>" in /v1/health since #37. The old container also answers 200,
          # so only a matching commit counts as deployed.
          want="+${SHA::7}"
          sleep 60
          for i in $(seq 1 60); do
            version=$(curl -fsS -m 60 "$ENGINE_URL/v1/health" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" || true)
            echo "attempt $i: engine reports ${version:-no answer}"
            case "$version" in *"$want") echo "Deployed $version"; exit 0 ;; esac
            sleep 15
          done
          echo "::error::The engine did not report commit ${SHA::7} within 15 minutes."
          exit 1
